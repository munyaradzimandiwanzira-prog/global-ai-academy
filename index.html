    <!-- Link previews (LinkedIn, Facebook, WhatsApp, X). Crawlers don't run JavaScript, so these are static.
         The image must be a PNG/JPEG at a full https:// address: LinkedIn and WhatsApp ignore SVG and relative paths.
         Change the image's file name (v2, v3…) when it changes, because LinkedIn caches previews for about a week.
         No og:url or canonical here: every page shares this file, and a fixed URL would point all of them at the home page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Global AI Academy" />
    <meta property="og:title" content="Global AI Academy: learn to code by running it" />
    <meta property="og:description" content="Free Python, web and AI lessons with a live editor, an AI tutor and games for kids. Made in Zimbabwe, works on your phone." />
    <meta property="og:image" content="https://skurulearning.com/og/skuru-share-v1.png" />
    <meta property="og:image:secure_url" content="https://skurulearning.com/og/skuru-share-v1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
