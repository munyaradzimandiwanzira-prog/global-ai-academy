# Weekly dependency updates. Security fixes arrive as soon as GitHub publishes an advisory.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Africa/Harare }
    open-pull-requests-limit: 5
    groups:
      cloudflare: { patterns: ["wrangler", "miniflare", "@cloudflare/*"] }
      build-and-test: { patterns: ["vite", "vitest", "@vitejs/*", "typescript", "tailwindcss", "@tailwindcss/*", "postcss", "autoprefixer"] }
      runtime-minor: { update-types: ["minor", "patch"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
