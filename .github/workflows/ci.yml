name: CI
on:
  push: { branches: [main] }
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Fail on any high/critical advisory in code that ships to visitors or runs on Cloudflare.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsx scripts/check-content.ts
      # Every PostgreSQL example and challenge, on real Postgres + pgvector.
      - run: npx tsx scripts/run-postgres.ts
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Deploy (skipped until CLOUDFLARE_API_TOKEN is set)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret — skipping deploy."; exit 0; fi
          npx wrangler d1 migrations apply global_ai_academy --remote
          npm run deploy
